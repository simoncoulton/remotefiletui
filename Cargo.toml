[package]
name = "remotefiletui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for browsing and transferring files over SFTP, FTP(S) and S3"
license = "MIT"
repository = "https://github.com/simoncoulton/remotefiletui"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-config = "1.13.0"
aws-sdk-s3 = "1.155.0"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
ratatui = "0.30.2"
russh = "0.65.0"
russh-sftp = "3.0.1"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
suppaftp = { version = "12.2.1", features = ["tokio-rustls-aws-lc-rs"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
serde_yaml_ng = "0.10.0"
unicode-width = "0.2.2"
webpki-roots = "1.0.11"
