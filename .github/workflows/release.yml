name: Release

# Push a tag like v0.1.0 to build binaries, publish a GitHub release and update the Homebrew formula.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$tag" = "$crate" ] || { echo "tag $tag != Cargo.toml $crate"; exit 1; }

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name="remotefiletui-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -C target/${{ matrix.target }}/release -czf "$name.tar.gz" remotefiletui
          shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: remotefiletui-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes

      - name: Update Homebrew formula
        run: |
          sha() { cat dist/remotefiletui-${GITHUB_REF_NAME}-$1.tar.gz.sha256; }
          scripts/gen-formula.sh "${GITHUB_REF_NAME#v}" \
            "$(sha aarch64-apple-darwin)" "$(sha x86_64-apple-darwin)" \
            "$(sha aarch64-unknown-linux-gnu)" "$(sha x86_64-unknown-linux-gnu)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Formula/remotefiletui.rb
          git commit -m "chore: update Homebrew formula for ${GITHUB_REF_NAME}"
          git push origin master
